<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語トレーナー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>ビジネス英語トレーナー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:20px;margin:0}.stats{font-size:12px;color:#666}
.card,.panel{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 14px #0001;margin-bottom:14px}
.title{font-size:20px;font-weight:700;margin-bottom:10px}.label{font-size:13px;color:#777;margin-bottom:8px}.big{font-size:25px;font-weight:700;line-height:1.5;margin:18px 0}.en{font-size:22px;font-weight:650;line-height:1.45}
button,select{font:inherit}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:9px;font-weight:650;font-size:16px}.primary{background:#222;color:#fff}.secondary{background:#eceff2}.good{background:#e7f3e9}.bad{background:#f7e7e7}.voice{background:#e8eef8}
.row{display:flex;gap:9px}.row button{flex:1}select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}.small{font-size:12px;color:#777;line-height:1.6}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{margin-top:0}.home-card{text-align:left}.home-card strong{display:block;font-size:17px;margin-bottom:4px}.home-card span{font-size:12px;color:#666}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}.tabs button{margin:0;padding:11px 6px;font-size:13px;background:#e9ebee}.tabs .active{background:#222;color:#fff}
.badge,.pill{display:inline-block;background:#eef0f3;border-radius:99px;padding:5px 10px;font-size:12px;color:#555}.progress{height:7px;background:#e7e9ed;border-radius:99px;overflow:hidden;margin:14px 0 20px}.progress>div{height:100%;background:#222;width:0}
.answer{display:none;background:#f6f7f8;border-radius:12px;padding:15px;margin:14px 0}.answer.show{display:block}.note{font-size:13px;color:#666;margin-top:8px;line-height:1.55}.timer{text-align:center;font-size:30px;font-weight:700;height:40px}.flash-main{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>
<div class="app">
<header><h1>ビジネス英語トレーナー</h1><div class="stats">正解率 <span id="accuracy">--</span></div></header>

<div id="home">
  <div class="panel">
    <div class="title">今日の練習</div>
    <div class="small" id="dueText"></div>
    <div class="grid" style="margin-top:14px">
      <button class="home-card secondary" onclick="openMode('sentence')"><strong>瞬間英作文</strong><span>日本語 → 英語</span></button>
      <button class="home-card secondary" onclick="openMode('flash')"><strong>単語カード</strong><span>英→日 / 日→英</span></button>
    </div>
  </div>
  <div class="panel">
    <div class="label">瞬間英作文カテゴリ</div>
    <select id="category">
      <option value="all">すべて</option>
      <option value="meeting">会議・打ち合わせ</option>
      <option value="customer">海外顧客対応</option>
      <option value="general">仕事の日常表現</option>
      <option value="travel">海外出張</option>
    </select>
    <p class="small">毎回ランダム出題。間違えた問題・復習期限が来た問題を優先します。</p>
  </div>
</div>

<div id="sentenceMode" class="hidden">
  <div class="tabs"><button class="active">瞬間英作文</button><button onclick="openMode('flash')">単語カード</button><button onclick="goHome()">ホーム</button></div>
  <div class="card">
    <span class="badge" id="sBadge"></span> <span class="pill" id="sCat"></span>
    <div class="progress"><div id="sBar"></div></div>
    <div class="label">日本語</div><div class="big" id="sQ"></div><div class="timer" id="timer">3</div>
    <button id="sShow" class="primary" onclick="showSentenceAnswer()">答えを見る</button>
    <div id="sAns" class="answer"><div class="en" id="sEn"></div><button class="voice" onclick="speakCurrentSentence()">🔊 英語を聞く</button><div class="note" id="sNote"></div></div>
    <div id="sJudge" class="hidden"><div class="row"><button class="good" onclick="judgeSentence(true)">○ できた</button><button class="bad" onclick="judgeSentence(false)">× 間違えた</button></div></div>
  </div>
</div>

<div id="flashMode" class="hidden">
  <div class="tabs"><button onclick="openMode('sentence')">瞬間英作文</button><button class="active">単語カード</button><button onclick="goHome()">ホーム</button></div>
  <div class="panel">
    <div class="label">出題方向</div>
    <select id="direction" onchange="startFlash()"><option value="mix">英→日 / 日→英をランダム</option><option value="en-ja">英語 → 日本語</option><option value="ja-en">日本語 → 英語</option></select>
  </div>
  <div class="card">
    <span class="badge" id="fBadge"></span> <span class="pill" id="fType"></span>
    <div class="progress"><div id="fBar"></div></div>
    <div class="flash-main"><div><div class="label" id="fPromptLabel"></div><div class="big" id="fFront"></div><button id="frontVoice" class="voice hidden" onclick="speakFlash()">🔊 発音を聞く</button></div></div>
    <button id="fShow" class="primary" onclick="showFlashAnswer()">答えを見る</button>
    <div id="fAns" class="answer"><div class="label" id="fAnswerLabel"></div><div class="en" id="fBack"></div><button id="backVoice" class="voice hidden" onclick="speakFlash()">🔊 英語を聞く</button><div class="note" id="fNote"></div></div>
    <div id="fJudge" class="hidden"><div class="row"><button class="good" onclick="judgeFlash(true)">○ 覚えた</button><button class="bad" onclick="judgeFlash(false)">× もう一度</button></div></div>
  </div>
</div>

<div id="finish" class="card hidden">
  <div class="title">お疲れさまでした！</div><div id="score"></div>
  <p class="small">間違えた問題は次回以降、優先して再出題します。</p>
  <button class="primary" onclick="repeatMode()">もう一度</button><button class="secondary" onclick="goHome()">ホームへ</button>
</div>
</div>

<script>
const sentenceData=[
{id:"s1",cat:"meeting",ja:"少しお時間ありますか？",en:"Do you have a moment?",note:"定番の会議表現"},
{id:"s2",cat:"meeting",ja:"この問題について話し合いたいです。",en:"I'd like to discuss this issue.",note:"discuss + 目的語。about は不要"},
{id:"s3",cat:"meeting",ja:"もう少し詳しく説明していただけますか？",en:"Could you explain that in a little more detail?",note:"explain + 目的語。about は不要"},
{id:"s4",cat:"meeting",ja:"別の選択肢も検討すべきです。",en:"We should consider other options.",note:"consider + 目的語。about は不要"},
{id:"s5",cat:"customer",ja:"現在、この問題の原因を調査しています。",en:"We are investigating the cause of this issue.",note:"investigate the cause"},
{id:"s6",cat:"customer",ja:"設計には問題がないことを確認しました。",en:"We have confirmed that there is no problem with the design.",note:"confirm + 内容"},
{id:"s7",cat:"customer",ja:"明日までに速報を提出します。",en:"I'll submit a preliminary report by tomorrow.",note:"preliminary report"},
{id:"s8",cat:"customer",ja:"できるだけ早く対応します。",en:"We'll handle it as soon as possible.",note:"handle it"},
{id:"s9",cat:"general",ja:"プロジェクトは順調に進んでいます。",en:"The project is going well.",note:"It's going well. も可"},
{id:"s10",cat:"general",ja:"少し予定より遅れています。",en:"I'm a little behind schedule.",note:"a little = 少し"},
{id:"s11",cat:"general",ja:"在宅勤務をしたいです。",en:"I'd like to work from home.",note:"work from home"},
{id:"s12",cat:"general",ja:"確認でき次第、連絡します。",en:"I'll let you know as soon as I confirm it.",note:"as soon as ..."},
{id:"s13",cat:"travel",ja:"乗り継ぎ便はどのゲートですか？",en:"Which gate is my connecting flight?",note:"connecting flight"},
{id:"s14",cat:"travel",ja:"この荷物は最終目的地まで預けられますか？",en:"Can I check this bag through to my final destination?",note:"check a bag through"}
];

const flashData=[
{id:"f1",type:"word",en:"deadline",ja:"締め切り・期限",note:"meet a deadline"},
{id:"f2",type:"word",en:"concern",ja:"懸念・心配",note:"have concerns about ..."},
{id:"f3",type:"word",en:"available",ja:"都合がつく・利用できる",note:"I'm available from 3 PM."},
{id:"f4",type:"word",en:"investigate",ja:"調査する",note:"investigate the cause"},
{id:"f5",type:"word",en:"identify",ja:"特定する",note:"identify the cause"},
{id:"f6",type:"phrase",en:"top priority",ja:"最優先事項",note:"This is our top priority."},
{id:"f7",type:"phrase",en:"behind schedule",ja:"予定より遅れて",note:"We're behind schedule."},
{id:"f8",type:"phrase",en:"so far",ja:"今のところ",note:"Everything is going well so far."},
{id:"f9",type:"phrase",en:"as soon as possible",ja:"できるだけ早く",note:"ASAP と略すこともある"},
{id:"f10",type:"phrase",en:"let me know",ja:"教えてください・知らせてください",note:"Please let me know."},
{id:"f11",type:"phrase",en:"work from home",ja:"在宅勤務をする",note:"仕事の文脈で自然"},
{id:"f12",type:"phrase",en:"preliminary report",ja:"速報・暫定報告",note:"preliminary = 暫定的な"},
{id:"f13",type:"phrase",en:"manufacturing process",ja:"製造工程",note:"manufacturing flow より自然"},
{id:"f14",type:"phrase",en:"move on to",ja:"〜へ移る",note:"Let's move on to the next topic."},
{id:"f15",type:"phrase",en:"Would that be okay?",ja:"それで大丈夫でしょうか？",note:"丁寧な確認"},
{id:"f16",type:"phrase",en:"Do you have a moment?",ja:"少しお時間ありますか？",note:"相談の切り出し"},
{id:"f17",type:"idiom",en:"handle it",ja:"それに対応する",note:"I'll handle it."},
{id:"f18",type:"phrase",en:"connecting flight",ja:"乗り継ぎ便",note:"空港でよく使う"}
];

const catName={meeting:"会議",customer:"顧客対応",general:"日常業務",travel:"海外出張"};
let stats=JSON.parse(localStorage.getItem("bieV2Stats")||'{"correct":0,"total":0,"items":{}}');
let currentMode="sentence",list=[],idx=0,sessionOK=0,sessionTotal=0,timer=null,left=3,activeDir="en-ja";

function today(){return Math.floor(Date.now()/86400000)}
function state(id){if(!stats.items[id])stats.items[id]={wrong:0,streak:0,due:0};return stats.items[id]}
function priority(id){let s=state(id);return s.wrong*10+(s.due<=today()?8:0)+Math.random()*5}
function ordered(a){return [...a].sort((x,y)=>priority(y.id)-priority(x.id))}
function save(){localStorage.setItem("bieV2Stats",JSON.stringify(stats));renderStats()}
function schedule(id,good){let s=state(id);if(good){s.streak++;s.wrong=Math.max(0,s.wrong-1);let d=[1,2,4,7,14,30][Math.min(s.streak-1,5)];s.due=today()+d}else{s.streak=0;s.wrong++;s.due=today()}}
function renderStats(){document.getElementById("accuracy").textContent=stats.total?Math.round(stats.correct/stats.total*100)+"%":"--";let due=[...sentenceData,...flashData].filter(x=>{let s=state(x.id);return (s.wrong>0||s.streak>0)&&s.due<=today()}).length;document.getElementById("dueText").textContent=due?`今日は ${due} 件の復習候補があります。`:"今日は新しい問題を中心に練習できます。"}
function hideAll(){["home","sentenceMode","flashMode","finish"].forEach(x=>document.getElementById(x).classList.add("hidden"))}
function goHome(){clearInterval(timer);hideAll();document.getElementById("home").classList.remove("hidden");renderStats()}
function openMode(m){currentMode=m;hideAll();document.getElementById(m==="sentence"?"sentenceMode":"flashMode").classList.remove("hidden");m==="sentence"?startSentence():startFlash()}
function repeatMode(){openMode(currentMode)}

function startSentence(){let c=document.getElementById("category").value,p=c==="all"?sentenceData:sentenceData.filter(x=>x.cat===c);list=ordered(p).slice(0,Math.min(10,p.length));idx=0;sessionOK=0;sessionTotal=0;showSentence()}
function showSentence(){clearInterval(timer);let q=list[idx];document.getElementById("sBadge").textContent=`${idx+1} / ${list.length}`;document.getElementById("sCat").textContent=catName[q.cat];document.getElementById("sBar").style.width=(idx/list.length*100)+"%";document.getElementById("sQ").textContent=q.ja;document.getElementById("sEn").textContent=q.en;document.getElementById("sNote").textContent=q.note;document.getElementById("sAns").classList.remove("show");document.getElementById("sJudge").classList.add("hidden");document.getElementById("sShow").classList.remove("hidden");left=3;document.getElementById("timer").textContent=left;timer=setInterval(()=>{left--;document.getElementById("timer").textContent=left;if(left<=0){clearInterval(timer);showSentenceAnswer()}},1000)}
function showSentenceAnswer(){clearInterval(timer);document.getElementById("timer").textContent="";document.getElementById("sAns").classList.add("show");document.getElementById("sJudge").classList.remove("hidden");document.getElementById("sShow").classList.add("hidden")}
function judgeSentence(g){sessionTotal++;stats.total++;if(g){sessionOK++;stats.correct++}schedule(list[idx].id,g);save();idx++;idx>=list.length?finish():showSentence()}

function speak(t){if(!("speechSynthesis" in window)){alert("音声読み上げに対応していません。");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}
function speakCurrentSentence(){speak(list[idx].en)}

function startFlash(){list=ordered(flashData).slice(0,12);idx=0;sessionOK=0;sessionTotal=0;showFlash()}
function showFlash(){let q=list[idx],d=document.getElementById("direction").value;activeDir=d==="mix"?(Math.random()<.5?"en-ja":"ja-en"):d;document.getElementById("fBadge").textContent=`${idx+1} / ${list.length}`;document.getElementById("fType").textContent=q.type==="word"?"単語":q.type==="idiom"?"熟語":"フレーズ";document.getElementById("fBar").style.width=(idx/list.length*100)+"%";document.getElementById("fPromptLabel").textContent=activeDir==="en-ja"?"英語 → 日本語":"日本語 → 英語";document.getElementById("fFront").textContent=activeDir==="en-ja"?q.en:q.ja;document.getElementById("fAnswerLabel").textContent=activeDir==="en-ja"?"日本語":"英語";document.getElementById("fBack").textContent=activeDir==="en-ja"?q.ja:q.en;document.getElementById("fNote").textContent=q.note;document.getElementById("fAns").classList.remove("show");document.getElementById("fJudge").classList.add("hidden");document.getElementById("fShow").classList.remove("hidden");document.getElementById("frontVoice").classList.toggle("hidden",activeDir!=="en-ja");document.getElementById("backVoice").classList.toggle("hidden",activeDir!=="ja-en")}
function showFlashAnswer(){document.getElementById("fAns").classList.add("show");document.getElementById("fJudge").classList.remove("hidden");document.getElementById("fShow").classList.add("hidden")}
function speakFlash(){speak(list[idx].en)}
function judgeFlash(g){sessionTotal++;stats.total++;if(g){sessionOK++;stats.correct++}schedule(list[idx].id,g);save();idx++;idx>=list.length?finish():showFlash()}

function finish(){hideAll();document.getElementById("finish").classList.remove("hidden");document.getElementById("score").textContent=`${sessionTotal}問中 ${sessionOK}問できた（${Math.round(sessionOK/sessionTotal*100)}%）`}
renderStats();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
