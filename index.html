<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="瞬間英作文">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>ビジネス瞬間英作文</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}
h1{font-size:20px;margin:0}.stats{font-size:13px;color:#666}
.card,.start{background:#fff;border-radius:18px;padding:22px;box-shadow:0 3px 14px #0001}
.start{margin-top:20px}.label{font-size:13px;color:#777;margin-bottom:8px}
.title{font-size:20px;font-weight:700;margin-bottom:14px}.jp{font-size:23px;font-weight:650;line-height:1.55;margin:12px 0 20px}
.badge{display:inline-block;background:#eef0f3;border-radius:99px;padding:5px 10px;font-size:12px;color:#555}
.progress{height:7px;background:#e7e9ed;border-radius:99px;overflow:hidden;margin:14px 0 22px}.progress>div{height:100%;background:#222;width:0;transition:.2s}
.timer{text-align:center;font-size:32px;font-weight:700;height:42px}
.answer{display:none;background:#f6f7f8;border-radius:12px;padding:15px;font-size:18px;line-height:1.5;margin:14px 0}
.answer.show{display:block}.note{font-size:13px;color:#666;margin-top:8px}
button,select{font:inherit}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:9px;font-weight:650;font-size:16px}
.primary{background:#222;color:#fff}.secondary{background:#eceff2}.good{background:#e7f3e9}.bad{background:#f7e7e7}
.row{display:flex;gap:9px}.row button{flex:1}select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}
.small{font-size:12px;color:#777;line-height:1.6}.hidden{display:none!important}
.install{margin-top:12px;padding:12px;border-radius:12px;background:#f0f3f6;font-size:13px;line-height:1.55}
</style>
</head>
<body>
<div class="app">
<header><h1>ビジネス瞬間英作文</h1><div class="stats">正解率 <span id="accuracy">--</span></div></header>

<div id="start" class="start">
<div class="label">今日の練習</div>
<div class="title">3〜5分でサクッと練習</div>
<select id="category">
<option value="meeting">会議・打ち合わせ</option>
<option value="customer">海外顧客対応</option>
<option value="general">仕事の日常表現</option>
</select>
<button class="primary" onclick="startSession()">スタート</button>
<div class="install"><b>iPhoneでアプリのように使うには</b><br>Safariでこのページを開き、共有 →「ホーム画面に追加」を選んでください。</div>
<p class="small">日本語を見たら、まず3秒くらいで英語を言ってみましょう。</p>
</div>

<div id="quiz" class="card hidden">
<span class="badge" id="badge"></span>
<div class="progress"><div id="bar"></div></div>
<div class="label">日本語</div><div class="jp" id="question"></div>
<div class="timer" id="timer">3</div>
<button id="showBtn" class="primary" onclick="showAnswer()">答えを見る</button>
<div id="answer" class="answer"><div id="en"></div><div id="note" class="note"></div></div>
<div id="resultBtns" class="hidden">
<div class="label">自分の答えは？</div>
<div class="row"><button class="good" onclick="judge(true)">○ 正解</button><button class="bad" onclick="judge(false)">× 不正解</button></div>
</div>
</div>

<div id="finish" class="card hidden">
<div class="title">お疲れさまでした！</div>
<div id="score"></div>
<p class="small">間違えた問題は次回優先して出題されます。</p>
<button class="primary" onclick="startSession()">もう一度</button>
<button class="secondary" onclick="goHome()">最初に戻る</button>
</div>
</div>

<script>
const data={
meeting:[
["少しお時間ありますか？","Do you have a moment?","定番の会議表現"],
["この問題について話し合いたいです。","I'd like to discuss this issue.","discuss + 目的語。about は不要"],
["もう少し詳しく説明していただけますか？","Could you explain that in a little more detail?","explain + 目的語。about は不要"],
["私の理解が正しければ、納期は金曜日ですね。","If I understand correctly, the deadline is Friday.","If I understand correctly, ..."],
["別の選択肢も検討すべきです。","We should consider other options.","consider + 目的語。about は不要"],
["次の議題に移りましょう。","Let's move on to the next topic.","move on to ..."],
["今日はここまでにしましょう。","That's all for today.","会議の締めに便利"],
["金曜日で次回の会議はどうですか？","How about Friday for the next meeting?","How about + 名詞 で提案"],
["金曜日はご都合いかがですか？","Would Friday work for you?","日程調整で便利"],
["この件について何か懸念があります。","I have some concerns about this issue.","have concerns about ..."]
],
customer:[
["現在、この問題の原因を調査しています。","We are investigating the cause of this issue.","investigate the cause"],
["まだ原因は分かっていません。","We don't know yet.","yet = まだ"],
["設計には問題がないことを確認しました。","We have confirmed that there is no problem with the design.","confirm + 内容"],
["現在、材料と製造工程を確認しています。","We are currently checking the material and manufacturing process.","manufacturing process"],
["明日までに原因を特定できます。","We can identify the cause by tomorrow.","by tomorrow = 明日までに"],
["この解析は私たちにとって最優先です。","This analysis is our top priority.","top priority"],
["明日までに速報を提出します。","I'll submit a preliminary report by tomorrow.","preliminary report"],
["木曜日までに解決策を提案します。","I'll propose a solution by Thursday.","propose a solution"],
["何かデータが必要なら、教えてください。","If you need any data, please let us know.","let us know"],
["できるだけ早く対応します。","We'll handle it as soon as possible.","handle it"]
],
general:[
["プロジェクトは順調に進んでいます。","The project is going well.","It's going well. も可"],
["プロジェクトは75%完了しています。","The project is 75% complete.","complete は形容詞としても使える"],
["少し予定より遅れています。","I'm a little behind schedule.","a little = 少し"],
["明日の朝までに終わらせます。","I'll finish it by tomorrow morning.","by = 期限"],
["今のところすべて順調です。","Everything is going well so far.","so far = 今のところ"],
["私は9時から10時、または3時から4時なら空いています。","I'm available from 9 to 10 AM, or from 3 to 4 PM.","available = 都合がつく"],
["その時間で大丈夫です。","That time works for me.","日程調整で便利"],
["ご協力ありがとうございます。","Thank you for your cooperation.","定番表現"],
["在宅勤務をしたいです。","I'd like to work from home.","仕事では work from home が自然"],
["確認でき次第、連絡します。","I'll let you know as soon as I confirm it.","as soon as ..."]
]};

let stats=JSON.parse(localStorage.getItem("bieStats")||'{"correct":0,"total":0,"weak":{}}');
let qs=[],i=0,ok=0,total=0,timer=null,left=3;
function acc(){document.getElementById("accuracy").textContent=stats.total?Math.round(stats.correct/stats.total*100)+"%":"--"} acc();
function startSession(){
 let cat=document.getElementById("category").value;
 qs=[...data[cat]].sort((a,b)=>(stats.weak[b[1]]||0)-(stats.weak[a[1]]||0)).slice(0,8);
 i=ok=total=0;document.getElementById("start").classList.add("hidden");document.getElementById("finish").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");showQ();
}
function showQ(){
 clearInterval(timer);let q=qs[i];
 document.getElementById("badge").textContent=`${i+1} / ${qs.length}`;
 document.getElementById("bar").style.width=(i/qs.length*100)+"%";
 document.getElementById("question").textContent=q[0];document.getElementById("en").textContent=q[1];document.getElementById("note").textContent=q[2];
 document.getElementById("answer").classList.remove("show");document.getElementById("resultBtns").classList.add("hidden");document.getElementById("showBtn").classList.remove("hidden");
 left=3;document.getElementById("timer").textContent=left;
 timer=setInterval(()=>{left--;document.getElementById("timer").textContent=left;if(left<=0){clearInterval(timer);showAnswer()}},1000);
}
function showAnswer(){clearInterval(timer);document.getElementById("timer").textContent="";document.getElementById("answer").classList.add("show");document.getElementById("showBtn").classList.add("hidden");document.getElementById("resultBtns").classList.remove("hidden")}
function judge(good){
 total++;if(good)ok++;stats.total++;if(good)stats.correct++;else stats.weak[qs[i][1]]=(stats.weak[qs[i][1]]||0)+1;
 localStorage.setItem("bieStats",JSON.stringify(stats));acc();i++;
 if(i>=qs.length)finish();else showQ();
}
function finish(){document.getElementById("quiz").classList.add("hidden");document.getElementById("finish").classList.remove("hidden");document.getElementById("score").textContent=`${total}問中 ${ok}問正解（${Math.round(ok/total*100)}%）`}
function goHome(){document.getElementById("finish").classList.add("hidden");document.getElementById("start").classList.remove("hidden")}
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
