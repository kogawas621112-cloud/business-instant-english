let stats=JSON.parse(localStorage.getItem("bieV4Stats")||'{"correct":0,"total":0,"items":{}}');
let currentMode="sentence",list=[],idx=0,sessionOK=0,sessionTotal=0,timer=null,left=3,activeDir="en-ja";
function today(){return Math.floor(Date.now()/86400000)} function state(id){if(!stats.items[id])stats.items[id]={wrong:0,streak:0,due:0};return stats.items[id]}
function priority(id){let s=state(id);return s.wrong*10+(s.due<=today()?8:0)+Math.random()*5} function ordered(a){return [...a].sort((x,y)=>priority(y.id)-priority(x.id))}
function save(){localStorage.setItem("bieV4Stats",JSON.stringify(stats));renderStats()}
function schedule(id,good){let s=state(id);if(good){s.streak++;s.wrong=Math.max(0,s.wrong-1);let d=[1,2,4,7,14,30][Math.min(s.streak-1,5)];s.due=today()+d}else{s.streak=0;s.wrong++;s.due=today()}}
function renderStats(){document.getElementById("accuracy").textContent=stats.total?Math.round(stats.correct/stats.total*100)+"%":"--";let due=[...sentenceData,...flashData].filter(x=>{let s=state(x.id);return (s.wrong>0||s.streak>0)&&s.due<=today()}).length;document.getElementById("dueText").textContent=due?`今日は ${due} 件の復習候補があります。`:"今日は新しい問題を中心に練習できます。"}
function hideAll(){["home","sentenceMode","flashMode","finish"].forEach(x=>document.getElementById(x).classList.add("hidden"))} function goHome(){clearInterval(timer);hideAll();document.getElementById("home").classList.remove("hidden");renderStats()}

function showSentence(){clearInterval(timer);let q=list[idx];document.getElementById("sBadge").textContent=`${idx+1} / ${list.length}`;document.getElementById("sCat").textContent=catName[q.cat];document.getElementById("sBar").style.width=(idx/list.length*100)+"%";document.getElementById("sQ").textContent=q.ja;document.getElementById("sEn").textContent=q.en;document.getElementById("sNote").textContent=q.note;document.getElementById("sAns").classList.remove("show");document.getElementById("sJudge").classList.add("hidden");document.getElementById("sShow").classList.remove("hidden");left=3;document.getElementById("timer").textContent=left;timer=setInterval(()=>{left--;document.getElementById("timer").textContent=left;if(left<=0){clearInterval(timer);showSentenceAnswer()}},1000)}
function showSentenceAnswer(){clearInterval(timer);document.getElementById("timer").textContent="";document.getElementById("sAns").classList.add("show");document.getElementById("sJudge").classList.remove("hidden");document.getElementById("sShow").classList.add("hidden")}
function judgeSentence(g){sessionTotal++;stats.total++;if(g){sessionOK++;stats.correct++}schedule(list[idx].id,g);save();idx++;idx>=list.length?finish():showSentence()}
function speak(t){if(!("speechSynthesis" in window)){alert("音声読み上げに対応していません。");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)} function speakCurrentSentence(){speak(list[idx].en)}
function startFlash(){let typ=document.getElementById("flashType").value,p=typ==="all"?flashData:flashData.filter(x=>x.type===typ),n=parseInt(document.getElementById("flashCount").value);list=ordered(p).slice(0,Math.min(n,p.length));idx=0;sessionOK=0;sessionTotal=0;showFlash()}
function showFlash(){let q=list[idx],d=document.getElementById("direction").value;activeDir=d==="mix"?(Math.random()<.5?"en-ja":"ja-en"):d;document.getElementById("fBadge").textContent=`${idx+1} / ${list.length}`;document.getElementById("fType").textContent=q.type==="word"?"単語":"熟語・フレーズ";document.getElementById("fBar").style.width=(idx/list.length*100)+"%";document.getElementById("fPromptLabel").textContent=activeDir==="en-ja"?"英語 → 日本語":"日本語 → 英語";document.getElementById("fFront").textContent=activeDir==="en-ja"?q.en:q.ja;document.getElementById("fAnswerLabel").textContent=activeDir==="en-ja"?"日本語":"英語";document.getElementById("fBack").textContent=activeDir==="en-ja"?q.ja:q.en;document.getElementById("fNote").textContent=q.note;document.getElementById("fAns").classList.remove("show");document.getElementById("fJudge").classList.add("hidden");document.getElementById("fShow").classList.remove("hidden");document.getElementById("frontVoice").classList.toggle("hidden",activeDir!=="en-ja");document.getElementById("backVoice").classList.toggle("hidden",activeDir!=="ja-en")}
function showFlashAnswer(){document.getElementById("fAns").classList.add("show");document.getElementById("fJudge").classList.remove("hidden");document.getElementById("fShow").classList.add("hidden")} function speakFlash(){speak(list[idx].en)}
function judgeFlash(g){sessionTotal++;stats.total++;if(g){sessionOK++;stats.correct++}schedule(list[idx].id,g);save();idx++;idx>=list.length?finish():showFlash()}
function finish(){hideAll();document.getElementById("finish").classList.remove("hidden");document.getElementById("score").textContent=`${sessionTotal}問中 ${sessionOK}問できた（${Math.round(sessionOK/sessionTotal*100)}%）`}
renderStats(); if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
