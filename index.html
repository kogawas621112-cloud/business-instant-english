<style>

.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:14px}.tabs button{margin:0;padding:11px 6px;font-size:13px;background:#e9ebee}.tabs .active{background:#222;color:#fff}

<header><h1>ビジネス英語トレーナー <span style="font-size:11px;background:#eef0f3;padding:3px 7px;border-radius:999px;vertical-align:2px">v7</span></h1><div class="stats">正解率 <span id="accuracy">--</span></div></header>

<div id="home">
<div class="panel"><div class="title">今日の練習</div><div class="small" id="dueText"></div>
<div class="counts"><span class="count">瞬間英作文 1546文</span><span class="count">単語・フレーズ 800件</span><span class="count">カテゴリ 35種</span></div>
<div class="grid"><button class="home-card secondary" onclick="openMode('sentence')"><strong>瞬間英作文</strong><span>日本語 → 英語</span></button>
<button class="home-card secondary" onclick="openMode('flash')"><strong>単語カード</strong><span>英→日 / 日→英</span></button></div>
<button class="home-card secondary" style="margin-top:10px;text-align:left" onclick="openMode('study')"><strong>📚 学習モード</strong><span>答えを隠さず、英文・意味・音声をじっくり学ぶ</span></button></div>

<div class="panel"><div class="label">瞬間英作文カテゴリ</div>
<select id="category"><option value="all">すべて</option><option value="meeting">会議・打ち合わせ</option><option value="customer">海外顧客対応</option><option value="project">プロジェクト管理</option><option value="technical">技術打ち合わせ</option><option value="manufacturing">製造・量産</option><option value="email">メール</option><option value="schedule">日程調整</option><option value="presentation">プレゼン</option><option value="travel">海外出張</option><option value="smalltalk">雑談</option><option value="troubleshooting">トラブル対応</option><option value="negotiation">調整・交渉</option><option value="phone">電話・メッセージ</option><option value="office">日常業務・社内</option><option value="quality">品質・評価</option><option value="design">設計・開発</option><option value="data">データ・分析</option><option value="leadership">依頼・指示・チーム</option><option value="daily_routine">日常・ルーティン</option><option value="home">家・家事</option><option value="family">家族</option><option value="food">食事・料理</option><option value="shopping">買い物</option><option value="restaurant">外食・カフェ</option><option value="friends">友人・誘い</option><option value="hobbies">趣味・休日</option><option value="weather">天気・季節</option><option value="transport">電車・移動</option><option value="directions">道案内</option><option value="appointments">予定・約束</option><option value="feelings">気持ち・リアクション</option><option value="daily_trouble">日常の困りごと</option><option value="hotel">ホテル・宿泊</option><option value="airport">空港・飛行機</option><option value="english_support">英会話で困ったとき</option></select>
<div class="label">出題範囲</div>
<select id="sentenceScope">
<option value="priority">新規・復習を優先</option>
<option value="all">全問題からランダム</option>
<option value="learned">一度「できた」にした問題</option>
<option value="weak">間違えた問題だけ</option>
</select>
<div class="label">1回の出題数</div><select id="sentenceCount"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
<p class="small">ランダム出題。間違えた問題・復習期限が来た問題を優先します。</p></div></div>

<div id="sentenceMode" class="hidden"><div class="tabs"><button class="active">瞬間英作文</button><button onclick="openMode('flash')">単語カード</button><button onclick="goHome()">ホーム</button></div>
<div class="card"><span class="badge" id="sBadge"></span> <span class="pill" id="sCat"></span><div class="progress"><div id="sBar"></div></div>
<div class="label">日本語</div><div class="big" id="sQ"></div><div class="timer" id="timer">3</div>
<button id="sShow" class="primary" onclick="showSentenceAnswer()">答えを見る</button>
<div id="sAns" class="answer"><div class="en" id="sEn"></div><button class="voice" onclick="speakCurrentSentence()">🔊 英語を聞く</button><div class="note" id="sNote"></div><button class="secondary" onclick="markForReview(list[idx].id)">↺ この文をまた練習したい</button></div>
<div id="sJudge" class="hidden"><div class="row"><button class="good" onclick="judgeSentence(true)">○ できた</button><button class="bad" onclick="judgeSentence(false)">× 間違えた</button></div></div></div></div>

<div id="flashMode" class="hidden"><div class="tabs"><button onclick="openMode('sentence')">瞬間英作文</button><button class="active">単語カード</button><button onclick="goHome()">ホーム</button></div>
<div class="panel"><div class="label">出題方向</div><select id="direction"><option value="mix">英→日 / 日→英をランダム</option><option value="en-ja">英語 → 日本語</option><option value="ja-en">日本語 → 英語</option></select>
<div class="label">種類</div><select id="flashType" onchange="updateFlashAvailable()"><option value="all">すべて</option><option value="word">単語</option><option value="phrase">熟語・フレーズ</option></select>
<div class="label">出題範囲</div><select id="flashScope" onchange="updateFlashAvailable()"><option value="priority">新規・復習を優先</option><option value="all">全問題からランダム</option><option value="learned">一度「覚えた」にした問題</option><option value="weak">間違えた問題だけ</option></select>
<div class="label">1回の出題数</div><select id="flashCount"><option>10</option><option selected>20</option><option>30</option><option>50</option></select>
<button class="primary" onclick="startFlash()">この設定で開始</button>
<div class="small" id="flashAvailable"></div></div>
<div class="card"><span class="badge" id="fBadge"></span> <span class="pill" id="fType"></span><div class="progress"><div id="fBar"></div></div>
<div class="flash-main"><div><div class="label" id="fPromptLabel"></div><div class="big" id="fFront"></div><button id="frontVoice" class="voice hidden" onclick="speakFlash()">🔊 発音を聞く</button></div></div>
<button id="fShow" class="primary" onclick="showFlashAnswer()">答えを見る</button>
<div id="fAns" class="answer"><div class="label" id="fAnswerLabel"></div><div class="en" id="fBack"></div><button id="backVoice" class="voice hidden" onclick="speakFlash()">🔊 英語を聞く</button><div class="note" id="fNote"></div><button class="secondary" onclick="markForReview(list[idx].id)">↺ この項目をまた練習したい</button></div>
<div id="fJudge" class="hidden"><div class="row"><button class="good" onclick="judgeFlash(true)">○ 覚えた</button><button class="bad" onclick="judgeFlash(false)">× もう一度</button></div></div></div></div>


<div id="studyMode" class="hidden">
  <div class="tabs"><button onclick="openMode('sentence')">瞬間英作文</button><button onclick="openMode('flash')">単語カード</button><button class="active">学習</button></div>
  <div class="panel">
    <div class="label">学習する内容</div>
    <select id="studyType" onchange="startStudy()">
      <option value="sentence">英文・会話文</option>
      <option value="word">単語</option>
      <option value="phrase">熟語・フレーズ</option>
    </select>
    <div class="label">カテゴリ（英文のみ）</div>
    <select id="studyCategory" onchange="startStudy()"><option value="all">すべて</option></select>
    <button class="secondary" onclick="goHome()">ホームへ戻る</button>
  </div>
  <div class="card">
    <span class="badge" id="studyBadge"></span> <span class="pill" id="studyKind"></span>
    <div class="label" style="margin-top:18px">English</div>
    <div class="big" id="studyEn"></div>
    <button class="voice" onclick="speakStudy()">🔊 英語を聞く</button>
    <div class="label" style="margin-top:18px">日本語</div>
    <div class="en" id="studyJa"></div>
    <div class="note" id="studyNote"></div>
    <button class="secondary" onclick="markStudyReview()">↺ 復習リストに入れる</button>
    <div class="row"><button class="secondary" onclick="studyPrev()">← 前へ</button><button class="primary" onclick="studyNext()">次へ →</button></div>
  </div>
</div>

<div id="finish" class="card hidden"><div class="title">お疲れさまでした！</div><div id="score"></div><p class="small">間違えた問題は次回以降、優先して再出題します。</p><button class="primary" onclick="repeatMode()">もう一度</button><button class="secondary" onclick="goHome()">ホームへ</button></div>
</div>

prove the coupling.","ja":"結合を改善する必要があります。","note":"technical improvement"},{"id":"v7p2461","type":"phrase","en":"We need to improve the group delay.","ja":"群遅延を改善する必要があります。","note":"technical improvement"},{"id":"v7p2462","type":"phrase","en":"We need to improve the insertion loss.","ja":"挿入損失を改善する必要があります。","note":"technical improvement"},{"id":"v7p2463","type":"phrase","en":"We need to improve the resonant frequency.","ja":"共振周波数を改善する必要があります。","note":"technical improvement"},{"id":"v7p2464","type":"phrase","en":"We need to improve the return loss.","ja":"リターンロスを改善する必要があります。","note":"technical improvement"}]; const catName={"meeting":"会議・打ち合わせ","customer":"海外顧客対応","project":"プロジェクト管理","technical":"技術打ち合わせ","manufacturing":"製造・量産","email":"メール","schedule":"日程調整","presentation":"プレゼン","travel":"海外出張","smalltalk":"雑談","troubleshooting":"トラブル対応","negotiation":"調整・交渉","phone":"電話・メッセージ","office":"日常業務・社内","quality":"品質・評価","design":"設計・開発","data":"データ・分析","leadership":"依頼・指示・チーム","daily_routine":"日常・ルーティン","home":"家・家事","family":"家族","food":"食事・料理","shopping":"買い物","restaurant":"外食・カフェ","friends":"友人・誘い","hobbies":"趣味・休日","weather":"天気・季節","transport":"電車・移動","directions":"道案内","appointments":"予定・約束","feelings":"気持ち・リアクション","daily_trouble":"日常の困りごと","hotel":"ホテル・宿泊","airport":"空港・飛行機","english_support":"英会話で困ったとき"};
let stats=JSON.parse(localStorage.getItem("bieV7Stats")||localStorage.getItem("bieV4Stats")||'{"correct":0,"total":0,"items":{}}');
let currentMode="sentence",list=[],idx=0,sessionOK=0,sessionTotal=0,timer=null,left=3,activeDir="en-ja";
function today(){return Math.floor(Date.now()/86400000)} function state(id){if(!stats.items[id])stats.items[id]={wrong:0,streak:0,due:0};return stats.items[id]}
function priority(id){let s=state(id);return s.wrong*10+(s.due<=today()?8:0)+Math.random()*5} function ordered(a){return [...a].sort((x,y)=>priority(y.id)-priority(x.id))}
function save(){localStorage.setItem("bieV7Stats",JSON.stringify(stats));renderStats()}
function schedule(id,good){let s=state(id);if(good){s.streak++;s.wrong=Math.max(0,s.wrong-1);let d=[1,2,4,7,14,30][Math.min(s.streak-1,5)];s.due=today()+d}else{s.streak=0;s.wrong++;s.due=today()}}
function renderStats(){document.getElementById("accuracy").textContent=stats.total?Math.round(stats.correct/stats.total*100)+"%":"--";let due=[...sentenceData,...flashData].filter(x=>{let s=state(x.id);return (s.wrong>0||s.streak>0)&&s.due<=today()}).length;document.getElementById("dueText").textContent=due?`今日は ${due} 件の復習候補があります。`:"今日は新しい問題を中心に練習できます。"}
function hideAll(){["home","sentenceMode","flashMode","studyMode","finish"].forEach(x=>document.getElementById(x).classList.add("hidden"))} function goHome(){clearInterval(timer);hideAll();document.getElementById("home").classList.remove("hidden");renderStats()}
function openMode(m){currentMode=m;hideAll();
if(m==="sentence"){document.getElementById("sentenceMode").classList.remove("hidden");startSentence()}
else if(m==="flash"){document.getElementById("flashMode").classList.remove("hidden");updateFlashAvailable();startFlash()}
else {document.getElementById("studyMode").classList.remove("hidden");initStudyCategories();startStudy()}}
function repeatMode(){openMode(currentMode)}

function filterScope(pool,scope){
  if(scope==="learned") return pool.filter(x=>state(x.id).streak>0);
  if(scope==="weak") return pool.filter(x=>state(x.id).wrong>0 || state(x.id).review);
  return pool;
}
function randomOrder(a){return [...a].sort(()=>Math.random()-.5)}
function markForReview(id){
  let s=state(id); s.review=true; s.due=today(); save();
  alert("復習リストに入れました。");
}
function updateFlashAvailable(){
  if(!document.getElementById("flashType")) return;
  let typ=document.getElementById("flashType").value;
  let p=typ==="all"?flashData:flashData.filter(x=>x.type===typ);
  let scope=document.getElementById("flashScope").value;
  p=filterScope(p,scope);
  document.getElementById("flashAvailable").textContent=`現在の条件で ${p.length} 件あります。`;
}

function startSentence(){
let c=document.getElementById("category").value;
let p=c==="all"?sentenceData:sentenceData.filter(x=>x.cat===c);
let scope=document.getElementById("sentenceScope").value;
p=filterScope(p,scope);
let n=parseInt(document.getElementById("sentenceCount").value);
list=(scope==="all"?randomOrder(p):ordered(p)).slice(0,Math.min(n,p.length));
idx=0;sessionOK=0;sessionTotal=0;
if(!list.length){alert("この条件に該当する問題がありません。");goHome();return}
showSentence()}
function showSentence(){clearInterval(timer);let q=list[idx];document.getElementById("sBadge").textContent=`${idx+1} / ${list.length}`;document.getElementById("sCat").textContent=catName[q.cat];document.getElementById("sBar").style.width=(idx/list.length*100)+"%";document.getElementById("sQ").textContent=q.ja;document.getElementById("sEn").textContent=q.en;document.getElementById("sNote").textContent=q.note;document.getElementById("sAns").classList.remove("show");document.getElementById("sJudge").classList.add("hidden");document.getElementById("sShow").classList.remove("hidden");left=3;document.getElementById("timer").textContent=left;timer=setInterval(()=>{left--;document.getElementById("timer").textContent=left;if(left<=0){clearInterval(timer);showSentenceAnswer()}},1000)}
function showSentenceAnswer(){clearInterval(timer);document.getElementById("timer").textContent="";document.getElementById("sAns").classList.add("show");document.getElementById("sJudge").classList.remove("hidden");document.getElementById("sShow").classList.add("hidden")}
function judgeSentence(g){sessionTotal++;stats.total++;if(g){sessionOK++;stats.correct++;state(list[idx].id).review=false}schedule(list[idx].id,g);save();idx++;idx>=list.length?finish():showSentence()}
function speak(t){if(!("speechSynthesis" in window)){alert("音声読み上げに対応していません。");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)} function speakCurrentSentence(){speak(list[idx].en)}
function startFlash(){
let typ=document.getElementById("flashType").value;
let p=typ==="all"?flashData:flashData.filter(x=>x.type===typ);
let scope=document.getElementById("flashScope").value;
p=filterScope(p,scope);
let n=parseInt(document.getElementById("flashCount").value);
list=(scope==="all"?randomOrder(p):ordered(p)).slice(0,Math.min(n,p.length));
idx=0;sessionOK=0;sessionTotal=0;updateFlashAvailable();
if(!list.length){document.getElementById("fFront").textContent="この条件に該当する項目がありません。";return}
showFlash()}
function showFlash(){let q=list[idx],d=document.getElementById("direction").value;activeDir=d==="mix"?(Math.random()<.5?"en-ja":"ja-en"):d;document.getElementById("fBadge").textContent=`${idx+1} / ${list.length}`;document.getElementById("fType").textContent=q.type==="word"?"単語":"熟語・フレーズ";document.getElementById("fBar").style.width=(idx/list.length*100)+"%";document.getElementById("fPromptLabel").textContent=activeDir==="en-ja"?"英語 → 日本語":"日本語 → 英語";document.getElementById("fFront").textContent=activeDir==="en-ja"?q.en:q.ja;document.getElementById("fAnswerLabel").textContent=activeDir==="en-ja"?"日本語":"英語";document.getElementById("fBack").textContent=activeDir==="en-ja"?q.ja:q.en;document.getElementById("fNote").textContent=q.note;document.getElementById("fAns").classList.remove("show");document.getElementById("fJudge").classList.add("hidden");document.getElementById("fShow").classList.remove("hidden");document.getElementById("frontVoice").classList.toggle("hidden",activeDir!=="en-ja");document.getElementById("backVoice").classList.toggle("hidden",activeDir!=="ja-en")}
function showFlashAnswer(){document.getElementById("fAns").classList.add("show");document.getElementById("fJudge").classList.remove("hidden");document.getElementById("fShow").classList.add("hidden")} function speakFlash(){speak(list[idx].en)}
function judgeFlash(g){sessionTotal++;stats.total++;if(g){sessionOK++;stats.correct++;state(list[idx].id).review=false}schedule(list[idx].id,g);save();idx++;idx>=list.length?finish():showFlash()}
function finish(){hideAll();document.getElementById("finish").classList.remove("hidden");document.getElementById("score").textContent=`${sessionTotal}問中 ${sessionOK}問できた（${Math.round(sessionOK/sessionTotal*100)}%）`}

let studyList=[],studyIdx=0;
function initStudyCategories(){
  let s=document.getElementById("studyCategory");
  if(s.options.length>1)return;
  Object.entries(catName).forEach(([k,v])=>{let o=document.createElement("option");o.value=k;o.textContent=v;s.appendChild(o)});
}
function startStudy(){
  let typ=document.getElementById("studyType").value;
  let cat=document.getElementById("studyCategory").value;
  if(typ==="sentence"){
    studyList=cat==="all"?[...sentenceData]:sentenceData.filter(x=>x.cat===cat);
    document.getElementById("studyCategory").disabled=false;
  }else{
    studyList=flashData.filter(x=>x.type===typ);
    document.getElementById("studyCategory").disabled=true;
  }
  studyList=randomOrder(studyList);studyIdx=0;showStudy();
}
function showStudy(){
  if(!studyList.length)return;
  let q=studyList[studyIdx],isSentence=!!q.cat;
  document.getElementById("studyBadge").textContent=`${studyIdx+1} / ${studyList.length}`;
  document.getElementById("studyKind").textContent=isSentence?(catName[q.cat]||"英文"):(q.type==="word"?"単語":"熟語・フレーズ");
  document.getElementById("studyEn").textContent=q.en;
  document.getElementById("studyJa").textContent=q.ja;
  document.getElementById("studyNote").textContent=q.note||"";
}
function studyNext(){if(!studyList.length)return;studyIdx=(studyIdx+1)%studyList.length;showStudy()}
function studyPrev(){if(!studyList.length)return;studyIdx=(studyIdx-1+studyList.length)%studyList.length;showStudy()}
function speakStudy(){if(studyList.length)speak(studyList[studyIdx].en)}
function markStudyReview(){if(!studyList.length)return;markForReview(studyList[studyIdx].id)}

renderStats(); if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
